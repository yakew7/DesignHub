name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Starts `pnpm start` (see lighthouserc.json), audits the home page, the Color Studio, Brand Projects and three other studios five
      # times each, checks the thresholds on the median run and writes the reports to .lighthouseci/.
      # Accessibility, best practices and SEO must score 100 everywhere. Performance must score 90 on
      # the home page, 90 on /colors and 70 on /projects (each fails below its floor); on the other studios it is only a
      # warning, because shared CI
      # runners are noisy and a studio is a much larger page.
      - run: pnpm dlx @lhci/cli autorun
      - name: Scores in the job summary
        if: always()
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
