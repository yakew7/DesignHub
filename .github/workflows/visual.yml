name: Visual

# Makes the screenshots again and commits them to main. Started by hand, after an intended layout change: their pixels
# depend on this runner image, so they are made here and not on a laptop. The comparison runs on every push and pull
# request as the Screenshots job of the CI workflow, on that workflow's build.
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Make the screenshots again and commit them to main"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Make the screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ inputs.update }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drop the Microsoft apt source
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
      # The browsers Playwright downloads, kept by Playwright's version (a new version is a new key).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm exec playwright install --with-deps chromium
      # The build's own cache (.next/cache), restored from the closest earlier run so a small change rebuilds little.
      - uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'hooks/**', 'store/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-
      - run: pnpm build
      - name: Make the screenshots
        run: VISUAL=1 pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          git commit -m "test: update the screenshots" || echo "Nothing changed"
          git push
