name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      # Unused files, exports and dependencies (knip.json lists the few exceptions, each with a reason in the docs).
      - run: pnpm check:unused
      # English messages nothing refers to (each costs bytes in every route). Lists them and does not fail the job.
      - name: Unused English messages
        run: pnpm check:messages
        continue-on-error: true
      - run: pnpm build
      - run: pnpm --filter designhub build
      - name: Smoke test the built CLI
        run: node packages/cli/dist/designhub.mjs --help
