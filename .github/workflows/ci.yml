name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      # Unused files, exports and dependencies (knip.json lists the few exceptions, each with a reason in the docs).
      - run: pnpm check:unused
      # Known advisories in the production dependencies, listed in the job summary. High and critical ones fail the
      # job; a moderate or lower one is only listed. The audit itself may not fail the step (the registry can be down).
      - name: Dependency advisories
        run: |
          pnpm audit --prod --json > audit.json || true
          node scripts/audit-summary.mjs audit.json >> "$GITHUB_STEP_SUMMARY"
      # Every file that uses a studio area's messages imports the area (docs/i18n-architecture.md); fails the job.
      - run: pnpm check:areas
      # English messages nothing refers to (each costs bytes in every route). Lists them and does not fail the job.
      - name: Unused English messages
        run: pnpm check:messages
        continue-on-error: true
      - run: pnpm build
      - run: pnpm --filter designhub build
      - name: Smoke test the built CLI
        run: node packages/cli/dist/designhub.mjs --help
