name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      # Unused files, exports and dependencies (knip.json lists the few exceptions, each with a reason in the docs).
      - run: pnpm check:unused
      # Known advisories in the production dependencies, listed in the job summary. High and critical ones fail the
      # job; a moderate or lower one is only listed. The audit itself may not fail the step (the registry can be down).
      - name: Dependency advisories
        run: |
          pnpm audit --prod --json > audit.json || true
          node scripts/audit-summary.mjs audit.json >> "$GITHUB_STEP_SUMMARY"
      # Every file that uses a studio area's messages imports the area (docs/i18n-architecture.md); fails the job.
      - run: pnpm check:areas
      # English messages nothing refers to (each costs bytes in every route). Lists them and does not fail the job.
      - name: Unused English messages
        run: pnpm check:messages
        continue-on-error: true
      # The build's own cache (.next/cache), restored from the closest earlier run so a small change rebuilds little.
      # Never .next itself: the artifact does that.
      - uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'hooks/**', 'store/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-
      - run: pnpm build
      - run: pnpm --filter designhub build
      - name: Smoke test the built CLI
        run: node packages/cli/dist/designhub.mjs --help
      # The build is made once here and used by the end-to-end and Lighthouse jobs below, so the three agree on it and
      # none of them installs and builds again. (The Visual workflow stays apart: it can also be started by hand to
      # make the screenshots again.)
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: |
            .next
            !.next/cache
            public/sw.js
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Playwright (shard ${{ matrix.shard }} of 3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: production-build
      # The runner image lists packages.microsoft.com, which sometimes answers 403 and fails apt-get update.
      # Chromium's dependencies come from the Ubuntu mirrors, so that source isn't needed.
      - name: Drop the Microsoft apt source
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
      # The browsers Playwright downloads, kept by Playwright's version (a new version is a new key).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm exec playwright install --with-deps chromium
      - name: Tests of this shard
        run: E2E_REPORT=test-results/report-${{ matrix.shard }}.json pnpm exec playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: test-results/report-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One check for the three shards, with the name the end-to-end check always had: it fails when a shard does, and
  # lists the tests that needed a retry and the slowest tests of all of them.
  e2e-result:
    name: E2E
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: e2e-report-*
          path: reports
      - name: Tests that needed a retry, and the slowest tests
        run: |
          files=$(find reports -name 'report-*.json' | sort)
          if [ -n "$files" ]; then node scripts/flaky-tests.mjs $files >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fail when a shard failed
        if: needs.e2e.result != 'success'
        run: |
          echo "::error::At least one end-to-end shard did not pass (see its job)."
          exit 1

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: production-build
      # Starts `pnpm start` (see lighthouserc.json), audits the home page, the Color Studio, Brand Projects and three
      # other studios five times each, checks the thresholds on the median run and writes the reports to .lighthouseci/.
      # Accessibility, best practices and SEO must score 100 everywhere. Performance must score 90 on the home page,
      # 90 on /colors and 70 on /projects (each fails below its floor); on the other studios it is only a warning,
      # because shared CI runners are noisy and a studio is a much larger page.
      - run: pnpm dlx @lhci/cli autorun
      - name: Scores in the job summary
        if: always()
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  # The screenshot comparison, on the shared build. It does nothing until tests/e2e/__screenshots__ exists; the Visual
  # workflow makes them (started by hand), because their pixels depend on this runner image.
  visual:
    name: Screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: production-build
      - name: Drop the Microsoft apt source
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
      # The browsers Playwright downloads, kept by Playwright's version (a new version is a new key).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm exec playwright install --with-deps chromium
      - name: Are there screenshots to compare with?
        id: have
        run: |
          if [ -d tests/e2e/__screenshots__ ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Compare with the screenshots
        if: steps.have.outputs.yes == 'true'
        run: VISUAL=1 pnpm exec playwright test tests/e2e/visual.spec.ts
      - name: No screenshots yet
        if: steps.have.outputs.yes != 'true'
        run: echo "::notice::tests/e2e/__screenshots__ does not exist yet. Run the Visual workflow by hand with update ticked to make it."
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
