name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image lists packages.microsoft.com, which sometimes answers 403 and fails apt-get update.
      # Chromium's dependencies come from the Ubuntu mirrors, so that source isn't needed.
      - name: Drop the Microsoft apt source
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Tests that needed a retry, and the slowest tests
        if: always()
        run: |
          if [ -f test-results/report.json ]; then node scripts/flaky-tests.mjs test-results/report.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
